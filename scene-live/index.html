<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WallpaperMachine · Scene Live</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  body { -webkit-user-select: none; user-select: none; }
  #poster {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover; opacity: 0; transition: opacity .45s ease;
    pointer-events: none;
  }
  #poster.visible { opacity: 1; }
  #poster.cover-fit { object-fit: cover; }
  #poster.contain-fit { object-fit: contain; }
  #wp {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; transition: opacity .6s ease;
    pointer-events: none;
  }
  #wp.visible { opacity: 1; }
  #wp canvas { display: block; width: 100% !important; height: 100% !important; }
  #error {
    position: absolute; left: 12px; bottom: 12px; max-width: 60%;
    padding: 6px 10px; border-radius: 8px;
    font: 12px/1.4 -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    color: rgba(255,255,255,.92); background: rgba(0,0,0,.55);
    opacity: 0; transition: opacity .2s ease; pointer-events: none;
  }
  #error.visible { opacity: 1; }
</style>
</head>
<body>
  <img id="poster" alt="" draggable="false">
  <div id="wp"></div>
  <div id="error"></div>
  <script src="/wallpaper-machine/engine/webwallgl.global.min.js"></script>
  <script src="/wallpaper-machine/scene-live/renderer.js"></script>
</body>
</html>
